<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 740 160" role="img" aria-labelledby="title desc"><title id="title">계약명의신탁</title><desc id="desc">매도인 丙과 계약명의 수탁자 乙 사이에 매매계약이 체결된다. 수탁자 乙과 신탁자 甲 사이에는 계약명의신탁 약정이 있다.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10 L2.5 5 Z" fill="#126453"/></marker><pattern id="road" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#eef1ee"/><path d="M-3 3L3 -3M0 14L14 0M11 17L17 11" stroke="#d6e0da" stroke-width="1"/></pattern></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, &apos;Malgun Gothic&apos;, &apos;Noto Sans CJK KR&apos;, sans-serif" fill="#253a37">
<rect x="9" y="50" width="108" height="81" rx="8" fill="#e8f3ee" stroke="#77928a" stroke-width="1.5"/>
<text x="63.0" y="86.5" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">丙</text>
<text x="63.0" y="111.5" text-anchor="middle" font-size="17" font-weight="460" fill="#253a37">매도인</text>
<rect x="303" y="50" width="138" height="81" rx="8" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="372.0" y="86.5" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">乙</text>
<text x="372.0" y="111.5" text-anchor="middle" font-size="17" font-weight="460" fill="#253a37">계약명의 수탁자</text>
<rect x="614" y="50" width="117" height="81" rx="8" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="672.5" y="86.5" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">甲</text>
<text x="672.5" y="111.5" text-anchor="middle" font-size="17" font-weight="460" fill="#253a37">신탁자</text>
<path d="M126,91 L291,91" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="209" y="71" text-anchor="middle" font-size="19" font-weight="630" fill="#253a37">매매계약</text>
