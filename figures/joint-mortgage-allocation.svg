<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 775 635" role="img" aria-labelledby="title desc"><title id="title">공동저당 부동산 A·B의 동시배당 예시</title><desc id="desc">A의 매각대금은 240만 원, B는 400만 원이다. 甲의 공동저당채권은 200만 원, A의 후순위저당권자 丙의 채권은 300만 원, B의 선행 가압류채권자 乙의 채권은 300만 원이다. B의 대금 중 甲의 채권액에 안분되는 160만 원을 甲에 대한 배당에서 B의 경매대가로 삼는다. 甲의 200만 원을 240 대 160으로 나누어 A에서 120만 원, B에서 80만 원을 배당한다. B에서 乙에게 300만 원, A에서 丙에게 120만 원이 배당된다. B의 남은 20만 원은 소유자 등에게 교부 또는 반환된다. 위 예에서, B 부동산의 매각대금 400만 원을 甲의 채권 200만 원과 乙의 채권 300만 원 사이에 안분하여 甲의 채권액에 상응하는 160만 원[= 400 × 200 / (200 + 300)]을 甲에 대한 배당에 관한 한 B 부동산의 경매대가로 보아, 甲의 채권 200만 원을 A 부동산의 경매대가 240만 원과 B 부동산의 경매대가 160만 원에 할당하여 A 부동산의 부담액은 120만 원[= 200 × 240 / (240 + 160)], B 부동산의 부담액은 80만 원(= 200 × 160 / 400)이 되고, 乙은 B 부동산으로부터 300만 원 전액을, 丙은 A 부동산으로부터 120만 원을 각 변제받고, B 부동산의 매각대금 중 잔여액 20만 원은 잉여금으로서 소유자 등에게 교부 또는 반환된다.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10 L2.5 5 Z" fill="#126453"/></marker><pattern id="road" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#eef1ee"/><path d="M-3 3L3 -3M0 14L14 0M11 17L17 11" stroke="#d6e0da" stroke-width="1"/></pattern></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, &apos;Malgun Gothic&apos;, &apos;Noto Sans CJK KR&apos;, sans-serif" fill="#253a37">
<rect x="16" y="16" width="93" height="43" rx="0" fill="#e8f3ee" stroke="#c3d3cb" stroke-width="1"/>
<text x="62.5" y="43.5" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">부동산</text>
<rect x="109" y="16" width="132" height="43" rx="0" fill="#e8f3ee" stroke="#c3d3cb" stroke-width="1"/>
<text x="175.0" y="43.5" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">매각대금</text>
<rect x="241" y="16" width="315" height="43" rx="0" fill="#e8f3ee" stroke="#c3d3cb" stroke-width="1"/>
<text x="398.5" y="43.5" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">순위 1번</text>
<rect x="556" y="16" width="202" height="43" rx="0" fill="#e8f3ee" stroke="#c3d3cb" stroke-width="1"/>
<text x="657.0" y="43.5" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">순위 2번</text>
<rect x="16" y="59" width="93" height="55" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="62.5" y="92.5" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">A</text>
<rect x="109" y="59" width="132" height="55" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="175.0" y="92.5" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">240만 원</text>
<rect x="241" y="59" width="315" height="55" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="398.5" y="92.5" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">공동저당권자 甲 200만 원</text>
<rect x="556" y="59" width="202" height="55" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="657.0" y="92.5" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">저당권자 丙 300만 원</text>
<rect x="16" y="114" width="93" height="102" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="62.5" y="171.0" text-anchor="middle" font-size="17" font-weight="650" fill="#253a37">B</text>
<rect x="109" y="114" width="132" height="102" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="175.0" y="171.0" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">400만 원</text>
<rect x="241" y="114" width="315" height="102" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="398.5" y="145.0" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">공동저당권자 甲 200만 원</text>
<text x="398.5" y="171.0" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">공동저당권 설정 전의</text>
<text x="398.5" y="197.0" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">가압류채권자 乙 300만 원</text>
<rect x="556" y="114" width="202" height="102" rx="0" fill="#ffffff" stroke="#c3d3cb" stroke-width="1"/>
<text x="657.0" y="171.0" text-anchor="middle" font-size="17" font-weight="440" fill="#253a37">—</text>
<rect x="16" y="235" width="742" height="377" rx="8" fill="#f5f8f6" stroke="#c3d3cb" stroke-width="1.5"/>
<text x="37" y="268" text-anchor="start" font-size="19" font-weight="680" fill="#126453">B 부동산의 경매대가</text>
<text x="37" y="297" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">B의 매각대금 400만 원을 甲의 채권(200만 원)과 乙의 채권(300만 원)에</text>
<text x="37" y="321" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">안분한다. 甲에 대한 배당에서 B의 경매대가는 160만 원이다.</text>
<text x="37" y="345" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">400 × 200 ÷ (200 + 300) = 160만 원</text>
<text x="37" y="388" text-anchor="start" font-size="19" font-weight="680" fill="#126453">공동저당 채권 200만 원의 분담</text>
<text x="37" y="417" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">A와 B의 경매대가는 240만 원과 160만 원이다.</text>
<text x="37" y="441" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">A 부담액  =  200 × 240 ÷ (240 + 160)  =  120만 원</text>
<text x="37" y="465" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">B 부담액  =  200 × 160 ÷ 400  =  80만 원</text>
<text x="37" y="507" text-anchor="start" font-size="19" font-weight="680" fill="#126453">배당과 잉여금</text>
<text x="37" y="536" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">乙은 B에서 300만 원 전액을, 丙은 A에서 120만 원을 변제받는다.</text>
<text x="37" y="560" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">B의 매각대금 중 잔여액 20만 원은 잉여금으로서</text>
<text x="37" y="584" text-anchor="start" font-size="17" font-weight="450" fill="#253a37">소유자 등에게 교부 또는 반환된다.</text>
</g></svg>