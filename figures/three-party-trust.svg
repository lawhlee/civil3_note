<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 615 292" role="img" aria-labelledby="title desc"><title id="title">삼자간 등기명의신탁</title><desc id="desc">매도인 丙과 매수인 겸 신탁자 甲이 매매계약을 체결하고, 丙이 수탁자 乙에게 직접 이전등기한다. 甲과 乙 사이에는 명의신탁약정이 있다.</desc>
