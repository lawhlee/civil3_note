<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 682 244" role="img" aria-labelledby="title desc"><title id="title">구분소유적 공유토지와 공로</title><desc id="desc">왼쪽부터 공로, 피고 소유지, 원고 소유 부분, A 소유 부분, 공로가 이어진다. 원고와 A의 토지는 구분소유적 공유관계이며, 화살표는 원고 소유 부분에서 피고 토지 쪽을 향한다.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10 L2.5 5 Z" fill="#126453"/></marker><pattern id="road" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#eef1ee"/><path d="M-3 3L3 -3M0 14L14 0M11 17L17 11" stroke="#d6e0da" stroke-width="1"/></pattern></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, &apos;Malgun Gothic&apos;, &apos;Noto Sans CJK KR&apos;, sans-serif" fill="#253a37">
<rect x="12" y="12" width="70" height="209" rx="2" fill="url(#road)" stroke="#77928a" stroke-width="1.5"/>
<text x="47" y="117" text-anchor="middle" font-size="20" font-weight="650" fill="#253a37">공로</text>
<rect x="599" y="12" width="70" height="209" rx="2" fill="url(#road)" stroke="#77928a" stroke-width="1.5"/>
<text x="634" y="117" text-anchor="middle" font-size="20" font-weight="650" fill="#253a37">공로</text>
<rect x="82" y="44" width="182" height="136" rx="0" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="173" y="111" text-anchor="middle" font-size="20" font-weight="650" fill="#253a37">피고 소유지</text>
<rect x="264" y="44" width="335" height="136" rx="0" fill="#e8f3ee" stroke="#126453" stroke-width="1.5"/>
<path d="M426,48 L426,177" stroke="#77928a" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="346" y="94" text-anchor="middle" font-size="19" font-weight="600" fill="#253a37">원고</text>
<text x="346" y="121" text-anchor="middle" font-size="19" font-weight="600" fill="#253a37">소유 부분</text>
<text x="510" y="94" text-anchor="middle" font-size="19" font-weight="600" fill="#253a37">A</text>
<text x="510" y="121" text-anchor="middle" font-size="19" font-weight="600" fill="#253a37">소유 부분</text>
