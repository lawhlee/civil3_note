<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 880 476" role="img" aria-labelledby="title desc"><title id="title">공유·합유·총유의 비교</title><desc id="desc">공유는 지분적·비율적 소유, 합유는 목적적 결합, 총유는 단체적 결합이다. 특징. 공유, 지분적·비율적 소유권. 합유, 목적적 결합. 총유, 단체적 결합. 지분. 공유, 처분의 자유(민법 제263조). 합유, 관념 인정, 단체적 구속. 총유, 관념 자체의 불인정. 처분·변경. 공유, 민법 제264조(동의). 합유, 민법 제272조 본문, (제706조와의 관계 유의). 총유, 민법 제276조 제1항. 보존. 공유, 단독. 합유, 단독. 총유, 단체의 행위. 대외. 공유, 보존: 통상적 공동소송, 처분·변경: 필수적 공동소송, (공유물분할, 경계확정). 합유, 원칙: 필수적 공동소송, 보존·조합원 개인책임:, 통상적 공동소송. 총유, 사단 자체 명의 소송, 또는 필수적 공동소송, (총원 전체).</desc>
