<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 812 451" role="img" aria-labelledby="title desc"><title id="title">연속 명의신탁과 제2 근저당권</title><desc id="desc">원고가 A와 제1 명의신탁약정을 체결한다. A와 피고 乙 사이에 제1 근저당권과 대물변제약정이 있고, 乙은 피고 甲과 제2 명의신탁약정을 한다. A에서 甲으로 소유권이전등기가 마쳐지고 甲은 피고 농협에 제2 근저당권을 설정한다. 원고는 농협에 제2 근저당권의 말소를, 甲·乙에 민법 제760조 또는 제741조에 따른 청구를 한다.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L9 5 L0 10 L2.5 5 Z" fill="#126453"/></marker><pattern id="road" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#eef1ee"/><path d="M-3 3L3 -3M0 14L14 0M11 17L17 11" stroke="#d6e0da" stroke-width="1"/></pattern></defs>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, &apos;Malgun Gothic&apos;, &apos;Noto Sans CJK KR&apos;, sans-serif" fill="#253a37">
<path d="M163,68 L435,68" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="296" y="53" text-anchor="middle" font-size="18" font-weight="570" fill="#253a37">① 제1 명의신탁약정</text>
<path d="M511,101 L699,204" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="705" y="130" text-anchor="middle" font-size="17" font-weight="450" fill="#253a37">② 제1 근저당권</text>
<text x="705" y="155" text-anchor="middle" font-size="17" font-weight="450" fill="#253a37">③ 대물변제약정</text>
<path d="M477,105 L396,205" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="384" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#253a37">⑤ 소유권이전등기</text>
<path d="M637,244 L463,244" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="550" y="271" text-anchor="middle" font-size="16" font-weight="550" fill="#253a37">④ 제2 명의신탁약정</text>
<path d="M374,281 L374,351" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)"/>
<text x="475" y="325" text-anchor="middle" font-size="17" font-weight="560" fill="#253a37">⑥ 제2 근저당권</text>
<path d="M94 106 L94 302" stroke="#126453" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="6 5"/>
<rect x="16" y="35" width="138" height="67" rx="8" fill="#e8f3ee" stroke="#77928a" stroke-width="1.5"/>
<text x="85.0" y="75.5" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">원고</text>
<rect x="446" y="35" width="127" height="67" rx="8" fill="#e8f3ee" stroke="#77928a" stroke-width="1.5"/>
<text x="509.5" y="75.5" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">A</text>
<rect x="305" y="212" width="140" height="64" rx="8" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="375.0" y="251.0" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">피고 甲</text>
<rect x="652" y="212" width="144" height="64" rx="8" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="724.0" y="251.0" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">피고 乙</text>
<rect x="305" y="365" width="140" height="64" rx="8" fill="#f8f2e7" stroke="#77928a" stroke-width="1.5"/>
<text x="375.0" y="404.0" text-anchor="middle" font-size="22" font-weight="670" fill="#253a37">피고 농협</text>
<rect x="12" y="314" width="254" height="117" rx="8" fill="#f5f8f6" stroke="#cedcd6" stroke-width="1.5"/>
<text x="28" y="341" text-anchor="start" font-size="17" font-weight="680" fill="#253a37">⑦ 이 사건 소 제기</text>
<text x="28" y="368" text-anchor="start" font-size="15" font-weight="450" fill="#253a37">농협: 제2 근저당권 말소</text>
<text x="28" y="389" text-anchor="start" font-size="15" font-weight="450" fill="#253a37">甲·乙: 민법 제760조 또는</text>
<text x="28" y="410" text-anchor="start" font-size="15" font-weight="450" fill="#253a37">제741조에 따른 청구</text>
</g></svg>