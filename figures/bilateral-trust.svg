<svg xmlns="http://www.w3.org/2000/svg" lang="ko" viewBox="0 0 604 136" role="img" aria-labelledby="title desc"><title id="title">양자간 명의신탁</title><desc id="desc">신탁자 甲에서 수탁자 乙로 등기명의가 이전된다.</desc>
